<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Acesso administrativo — Tati & Oyama</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%A7%81%3C/text%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{ --rosa-900:#7A1F44; --rosa-700:#C2185B; --rosa-200:#F7C6D9; --rosa-50:#FFF3F7; --tinta:#3B2430; --tinta-suave:#8A6773; }
  *{box-sizing:border-box;}
  body{margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; background:linear-gradient(160deg,var(--rosa-50),#fff 60%); font-family:'Manrope',sans-serif; color:var(--tinta); padding:24px;}
  .card{background:#fff; width:100%; max-width:400px; border-radius:26px; padding:40px 34px; box-shadow:0 24px 60px -30px rgba(122,31,68,.4); border:1px solid var(--rosa-200);}
  .mark{width:52px; height:52px; border-radius:50%; background:linear-gradient(135deg,var(--rosa-700),var(--rosa-900)); display:flex; align-items:center; justify-content:center; font-size:1.5rem; margin-bottom:18px;}
  h1{font-family:'Fraunces',serif; font-size:1.5rem; margin:0 0 6px; color:var(--rosa-900);}
  p.sub{color:var(--tinta-suave); margin:0 0 26px; font-size:.92rem;}
  label{font-size:.82rem; font-weight:700; display:block; margin-bottom:6px;}
  input{width:100%; padding:12px 14px; border-radius:12px; border:1.5px solid var(--rosa-200); font-family:inherit; font-size:.95rem; margin-bottom:16px;}
  input:focus{outline:none; border-color:var(--rosa-700);}
  button{width:100%; padding:13px; border:none; border-radius:999px; background:var(--rosa-700); color:#fff; font-weight:800; font-size:.95rem; cursor:pointer;}
  button:disabled{opacity:.6; cursor:default;}
  .msg{font-size:.85rem; margin-top:14px; padding:10px 12px; border-radius:10px;}
  .msg.err{background:#FDE8EE; color:#9B1C46;}
  .msg.ok{background:#E7F7EE; color:#1B7A43;}
  .back{display:block; text-align:center; margin-top:20px; font-size:.85rem; color:var(--tinta-suave); text-decoration:none;}
  .back:hover{color:var(--rosa-700);}
</style>
</head>
<body>
  <div class="card">
    <div class="mark">🔒</div>
    <h1>Área administrativa</h1>
    <p class="sub">Entre com seu usuário ou e-mail para gerenciar o site da Tati & Oyama.</p>
    <form id="loginForm">
      <label for="ident">Usuário ou e-mail</label>
      <input id="ident" autocomplete="username" placeholder="tatioyama ou seu@email.com" required>
      <label for="pass">Senha</label>
      <input id="pass" type="password" autocomplete="current-password" placeholder="••••••••" required>
      <button id="submitBtn" type="submit">Entrar</button>
    </form>
    <div id="msg"></div>
    <a class="back" href="../index.html">← Voltar para o site</a>
  </div>

<script>
const SUPABASE_URL = "https://muyafaecbftctxvwxpyy.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_efNcP5ircj5xCyEPnGilZg_a9EbNBlQ";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

// já logado? manda direto pro painel
sb.auth.getSession().then(({data}) => {
  if(data.session) window.location.href = 'painel.html';
});

const form = document.getElementById('loginForm');
const msgEl = document.getElementById('msg');
const btn = document.getElementById('submitBtn');

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  msgEl.innerHTML = '';
  btn.disabled = true; btn.textContent = 'Entrando...';

  const ident = document.getElementById('ident').value.trim();
  const pass = document.getElementById('pass').value;

  try{
    let email = ident;
    if(!ident.includes('@')){
      const { data: resolvedEmail, error: rpcErr } = await sb.rpc('get_email_by_username', { p_username: ident });
      if(rpcErr || !resolvedEmail) throw new Error('Usuário não encontrado.');
      email = resolvedEmail;
    }
    const { error } = await sb.auth.signInWithPassword({ email, password: pass });
    if(error) throw error;
    window.location.href = 'painel.html';
  }catch(err){
    msgEl.innerHTML = `<div class="msg err">${err.message === 'Invalid login credentials' ? 'Usuário ou senha incorretos.' : err.message}</div>`;
    btn.disabled = false; btn.textContent = 'Entrar';
  }
});
</script>
</body>
</html>
